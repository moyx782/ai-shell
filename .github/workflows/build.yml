name: Native builds
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ai-native
          path: dist/native/
